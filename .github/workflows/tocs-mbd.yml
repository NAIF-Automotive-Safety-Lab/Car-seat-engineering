name: T-OCS R4.1 Real MBD

on:
  workflow_dispatch:
  push:
    paths:
      - "R4.1/**"
      - "SR11/**"
      - "tools/**"
      - ".github/workflows/tocs-mbd.yml"

permissions:
  contents: read

concurrency:
  group: tocs-mbd-${{ github.ref }}
  cancel-in-progress: false

env:
  R41_PATH: R4.1/R4.1.step
  R41_SHA256: fbe6b17cdbf728a2e47963e567e12eeceb1352a36e719e7d1c55cc5f712a0a68
  R41_SOLIDS: "62"
  BODY_MANIFEST: SR11/manifests/V1_SR11_BODY_MAPPING.json
  CONDA_ENV: tocs-mbd
  PYTHON_VERSION: "3.12"
  CHRONO_VERSION: "10.0.0"
  EVIDENCE_DIR: artifacts

jobs:
  tocs-mbd:
    name: T-OCS R4.1 / Real 3D MBD
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GATE 0 — WORKFLOW SYNTAX
        id: gate0
        run: |
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          workflow = Path(".github/workflows/tocs-mbd.yml")
          document = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          if not isinstance(document, dict) or not isinstance(document.get("jobs"), dict):
              raise SystemExit("WORKFLOW_SYNTAX=FAIL REASON=INVALID_YAML_ROOT")
          runs = []
          for job in document["jobs"].values():
              for step in job.get("steps", []):
                  if isinstance(step, dict) and isinstance(step.get("run"), str):
                      runs.append(step["run"])
          for index, script in enumerate(runs):
              with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as handle:
                  handle.write(script)
                  path = handle.name
              result = subprocess.run(["bash", "-n", path], capture_output=True, text=True)
              if result.returncode:
                  print(result.stderr, end="")
                  raise SystemExit(f"WORKFLOW_SYNTAX=FAIL REASON=SHELL_SYNTAX INDEX={index}")
          print(f"WORKFLOW_YAML=PASS RUN_BLOCKS={len(runs)}")
          print("SHELL_SYNTAX=PASS")
          print("WORKFLOW_SYNTAX=PASS")
          PY

      - name: GATE 1 — HOST
        id: gate1
        run: |
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "$(uname -m)" == "x86_64" ]]
          command -v python3
          python3 --version
          echo "HOST_STATUS=PASS"

      - name: GATE 2 — PYCHRONO
        id: gate2
        run: |
          if [[ ! -f "SR11/adapter/pychrono_r41_adapter.py" ]]; then
            echo "PYCHRONO=BLOCKED"
            echo "REASON=missing_authoritative_adapter"
            exit 20
          fi
          if ! command -v conda >/dev/null 2>&1; then
            echo "PYCHRONO=BLOCKED"
            echo "REASON=conda_unavailable"
            exit 21
          fi
          conda create -y -n "${CONDA_ENV}" -c conda-forge "python=${PYTHON_VERSION}"
          conda activate "${CONDA_ENV}"
          conda install -y -c conda-forge "occt=7.9.2" "pythonocc-core=7.9.0" "swig>=4.0" cmake ninja git pkg-config
          git clone --depth 1 --branch "release/${CHRONO_VERSION}" https://github.com/projectchrono/chrono.git "${RUNNER_TEMP}/chrono"
          occt_config="$(find "${CONDA_PREFIX}" -name OpenCASCADEConfig.cmake -print -quit)"
          [[ -n "${occt_config}" ]]
          cmake -S "${RUNNER_TEMP}/chrono" -B "${RUNNER_TEMP}/chrono-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}/chrono" \
            -DCH_ENABLE_MODULE_CORE=ON \
            -DCH_ENABLE_MODULE_CASCADE=ON \
            -DCH_ENABLE_MODULE_PYTHON=ON \
            -DCH_ENABLE_MODULE_POSTPROCESS=ON \
            -DPYTHON_EXECUTABLE="$(command -v python)" \
            -DOpenCASCADE_DIR="${occt_config}"
          cmake --build "${RUNNER_TEMP}/chrono-build" --parallel
          cmake --install "${RUNNER_TEMP}/chrono-build"
          export PYTHONPATH="${CONDA_PREFIX}/chrono/bin:${PYTHONPATH:-}"
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/chrono/lib:${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          python - <<'PY'
          import pychrono.core
          import pychrono.cascade
          print("PYCHRONO_IMPORT=PASS")
          print("CASCADE_IMPORT=PASS")
          PY
          echo "PYCHRONO=PASS"

      - name: GATE 3 — MODEL INTEGRITY
        id: gate3
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          manifest_path = Path(os.environ["BODY_MANIFEST"])
          expected_solids = int(os.environ["R41_SOLIDS"])
          required = {
              "BASE", "RAIL_L", "RAIL_R", "CARRIAGE", "ABSORBER_L", "ABSORBER_R",
              "SEATBACK", "ROT_CTRL_L", "ROT_CTRL_R", "LOCK_L", "LOCK_R", "ENDSTOPS",
              "HINGE", "ANTI_RACK", "SHOULDER_ANCHOR", "SHOULDER_GUSSET", "SHOULDER_ROOT",
              "SHOULDER_BRACE", "SHOULDER_FRAME_BRACKET",
          }

          def fail(reason, **fields):
              print("MODEL_INTEGRITY=FAIL")
              print(f"REASON={reason}")
              for key, value in fields.items():
                  if isinstance(value, (list, set, tuple)):
                      value = ",".join(str(item) for item in sorted(value))
                  print(f"{key}={value}")
              raise SystemExit(1)

          if not manifest_path.is_file():
              fail("missing_authoritative_identifier", MISSING_FILE=manifest_path)
          try:
              document = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception as exc:
              fail("invalid_authoritative_manifest", DETAIL=repr(exc))
          if not isinstance(document, dict) or "bodies" not in document:
              fail("incomplete_authoritative_evidence", REASON_DETAIL="missing_bodies_array")
          bodies = document["bodies"]
          if not isinstance(bodies, list) or not bodies:
              fail("incomplete_authoritative_evidence", REASON_DETAIL="bodies_not_nonempty_list")

          ids = []
          covered = []
          for index, body in enumerate(bodies):
              if not isinstance(body, dict):
                  fail("incomplete_authoritative_evidence", BODY_INDEX=index, DETAIL="body_not_object")
              if "mbd_body_id" not in body:
                  fail("missing_authoritative_identifier", BODY_INDEX=index, DETAIL="missing_mbd_body_id")
              body_id = body["mbd_body_id"]
              if not isinstance(body_id, str) or not body_id.strip():
                  fail("missing_authoritative_identifier", BODY_INDEX=index, DETAIL="empty_mbd_body_id")
              ids.append(body_id.strip())
              if "step_solid_indices" not in body or not isinstance(body["step_solid_indices"], list):
                  fail("incomplete_authoritative_evidence", BODY_INDEX=index, DETAIL="missing_step_solid_indices")
              for solid in body["step_solid_indices"]:
                  if not isinstance(solid, int) or isinstance(solid, bool):
                      fail("incomplete_authoritative_evidence", BODY_INDEX=index, DETAIL="non_integer_step_solid_index")
                  covered.append(solid)

          actual = set(ids)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          missing = sorted(required - actual)
          extra = sorted(actual - required)
          if missing or duplicates:
              fail("entity_set_mismatch", MISSING=missing or "NONE", DUPLICATE=duplicates or "NONE", EXTRA=extra or "NONE")
          if document.get("solids") != expected_solids:
              fail("coverage_mismatch", DECLARED_SOLIDS=document.get("solids"), EXPECTED_SOLIDS=expected_solids)
          if len(covered) != expected_solids or set(covered) != set(range(1, expected_solids + 1)):
              fail("coverage_mismatch", COVERAGE=f"{len(set(covered))}/{expected_solids}", EXPECTED=f"1..{expected_solids}")
          duplicate_solids = sorted({item for item in covered if covered.count(item) > 1})
          if duplicate_solids:
              fail("duplicate_step_solid_index", DUPLICATE=duplicate_solids)

          print("MISSING=NONE")
          print("DUPLICATE=NONE")
          print("EXTRA=" + (",".join(extra) if extra else "NONE"))
          print(f"STEP_MAPPING_COVERAGE={len(set(covered))}/{expected_solids}")
          print("UNIQUE_MBD_BODY_IDS=PASS")
          print("MODEL_INTEGRITY=PASS")
          PY

      - name: GATE 4 — R4.1 SHA
        id: gate4
        run: |
          [[ -f "${R41_PATH}" ]]
          actual="$(sha256sum "${R41_PATH}" | awk '{print $1}')"
          echo "EXPECTED_SHA256=${R41_SHA256}"
          echo "ACTUAL_SHA256=${actual}"
          [[ "${actual}" == "${R41_SHA256}" ]]
          echo "SHA_MATCH=PASS"

      - name: GATE 5 — STEP READ
        id: gate5
        run: |
          [[ -f "tools/validate_r41_step.py" ]]
          python3 -m py_compile tools/validate_r41_step.py
          python3 tools/validate_r41_step.py "${R41_PATH}" "${EVIDENCE_DIR}/r41_readability.json" --readability-only
          echo "STEP_READ=PASS"

      - name: GATE 6 — SOLID COUNT
        id: gate6
        run: |
          python3 tools/validate_r41_step.py "${R41_PATH}" "${EVIDENCE_DIR}/r41_solids.json" --solid-count-only
          echo "SOLID_COUNT=PASS"

      - name: GATE 7 — SR11 ADAPTER
        id: gate7
        run: |
          [[ -f "tools/validate_sr11_adapter.py" ]]
          python3 -m py_compile tools/validate_sr11_adapter.py
          python3 tools/validate_sr11_adapter.py
          echo "SR11_ADAPTER=PASS"

      - name: REAL MBD — NOT_STARTED/BLOCKED unless solver evidence exists
        if: ${{ success() }}
        run: |
          echo "REAL_MBD=NOT_STARTED"
          echo "REASON=solver_execution_not_requested_by_validation_gates"
          echo "PHYSICAL_VALIDATION=NOT_CLAIMED"

      - name: Evidence
        if: always()
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "r41_path=${R41_PATH}"
            echo "r41_sha256_expected=${R41_SHA256}"
            echo "r41_sha256_actual=$(sha256sum "${R41_PATH}" 2>/dev/null | awk '{print $1}')"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/provenance.txt"
          find "${EVIDENCE_DIR}" -type f -print0 | sort -z | xargs -0 -r sha256sum > "${EVIDENCE_DIR}/SHA256SUMS"
