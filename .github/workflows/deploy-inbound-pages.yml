name: Deploy T-OCS V7 public L0 landing page

on:
  push:
    branches: ["main"]
    paths:
      - "docs/inbound/**"
      - ".github/workflows/deploy-inbound-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public L0 website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/inbound
      - name: Deploy public L0 website
        id: deployment
        uses: actions/deploy-pages@v4
