name: G2 Capability Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check required G2 control artifacts
        run: |
          test -f T-OCS-V7-AEGIS/G2/MODEL/bodies.json
          test -f T-OCS-V7-AEGIS/G2/MODEL/joints.json
          test -f T-OCS-V7-AEGIS/G2/ENGINE/CHRONO/runtime_probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path("T-OCS-V7-AEGIS/G2/MODEL/bodies.json"),Path("T-OCS-V7-AEGIS/G2/MODEL/joints.json"),Path("T-OCS-V7-AEGIS/G2/ENGINE/CHRONO/runtime_probe.json")]:
              json.loads(p.read_text())
          print("G2_CAPABILITY_ARTIFACTS=PASS")
          PY